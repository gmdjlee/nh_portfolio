<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    .ac { font-family: "Noto Sans KR", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .ac .num { font-weight: 700; letter-spacing: -.025em; }
    .ac .lab { font-size: 11px; font-weight: 500; color: #8A9099; }
    a { color: #3F6B4A; } a:hover { color: #2F4A34; }
  </style>
</helmet>
<div class="ac" style="width: 390px; height: 844px; background: #F4F6F8; color: #111214; display: flex; flex-direction: column; overflow: hidden;">

  <div style="background: #FFFFFF; flex-shrink: 0;">
    <div style="height: 52px; padding: 0 6px 0 16px; display: flex; align-items: center;">
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -.02em;">계좌</span>
      <span style="flex: 1;"></span>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F6B4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.6v2.8M12 18.6v2.8M21.4 12h-2.8M5.4 12H2.6M18.6 5.4l-2 2M7.4 16.6l-2 2M18.6 18.6l-2-2M7.4 7.4l-2-2"/>
        </svg>
      </div>
    </div>
    <div style="padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 2px;">
      <span class="lab">전체 평가금액</span>
      <span class="num" style="font-size: 34px; line-height: 1.06; letter-spacing: -.035em;">138,920,000원</span>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 1px;">
        <span class="num" style="font-size: 15px; color: #D1453B;">+5,240,500원 (+3.92%)</span>
        <span class="lab">3개 계좌</span>
      </div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #EDEFF2; border-radius: 14px; padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 2px;">

        <div style="display: flex; align-items: center; gap: 6px; min-height: 26px;">
          <span style="font-size: 17px; font-weight: 700; letter-spacing: -.02em; color: {{a.nameColor}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{a.name}}</span>
          <sc-if value="{{a.dormant}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 10px; font-weight: 700; color: #6E7481; background: #F1F3F5; padding: 2px 7px; border-radius: 6px; white-space: nowrap; flex-shrink: 0;">휴면</span>
          </sc-if>
          <span style="flex: 1;"></span>
          <div style="width: 44px; height: 44px; margin: -9px 0; display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9AA1AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>
            </svg>
          </div>
        </div>

        <span class="num" style="font-size: 12px; font-weight: 500; color: #8A9099; letter-spacing: 0;">{{a.no}} · {{a.stocks}}종목</span>

        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 9px;">
          <span class="num" style="font-size: 22px; letter-spacing: -.03em;">{{a.amount}}</span>
          <span class="num" style="font-size: 13px; color: {{a.plColor}};">{{a.pl}}</span>
        </div>

        <div style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #EDEFF2; margin-top: 11px;">
          <div style="width: {{a.stockW}}; background: #5B54D6;"></div>
          <div style="flex: 1; background: #E0A32E;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 6px;">
          <span class="num" style="font-size: 11px; color: #4A44B8;">주식 {{a.stockLabel}}</span>
          <span class="num" style="font-size: 11px; color: #8A6410;">현금 {{a.cashLabel}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const R = '#D1453B';
    // 손익(빨강·파랑)과 조작 요소(모스 초록)가 이미 쓰는 색은 피한다 — 한 행에서 섞이면 안 된다.
    // 주식 인디고, 현금 앰버. 라벨은 같은 색상의 어두운 값이라 흰 바탕에서 읽힌다(7.5:1 / 5.4:1).
    // 파이(22px)를 가른 막대로 바꿨다 — 같은 두 색이지만 비율이 눈금 없이도 읽히고,
    // 포트폴리오 화면의 비중 막대와 같은 형태라 두 화면이 한 언어를 쓴다.
    return {
      accounts: [
        { name: '종합계좌', nameColor: '#111214', no: '20101036881', stocks: '5', amount: '100,000,000원',
          pl: '+4,182,500원 (+4.36%)', plColor: R, dormant: false,
          stockW: '90%', stockLabel: '90.0%', cashLabel: '10.0%' },
        { name: 'CMA', nameColor: '#111214', no: '20101047992', stocks: '1', amount: '26,420,000원',
          pl: '+820,000원 (+3.20%)', plColor: R, dormant: false,
          stockW: '7.6%', stockLabel: '7.6%', cashLabel: '92.4%' },
        // 이름을 아직 안 지은 계좌 — API 가 주는 계좌구분을 흐린 글자로 대신 보여준다.
        { name: '운영 일반', nameColor: '#9AA1AC', no: '20101055103', stocks: '2', amount: '12,500,000원',
          pl: '+238,000원 (+1.94%)', plColor: R, dormant: true,
          stockW: '95.9%', stockLabel: '95.9%', cashLabel: '4.1%' },
      ],
    };
  }
}
</script>
</body>
</html>
