org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9.0+ built-in Kotlin support rejects an explicit org.jetbrains.kotlin.android plugin
# application (see https://kotl.in/gradle/agp-built-in-kotlin). Brief pins that plugin id
# via libs.plugins.kotlin.android, so opt out (documented, removed in AGP 10.0) to keep it working.
android.builtInKotlin=false
# Same reason: AGP 9's new DSL (default on) is also incompatible with the explicit
# org.jetbrains.kotlin.android plugin; AGP's own error points at this flag to bypass it.
android.newDsl=false
