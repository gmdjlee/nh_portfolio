<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    .cur { font-family: "Noto Sans KR", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    a { color: #3F6B4A; } a:hover { color: #2F4A34; }
  </style>
</helmet>
<div class="cur" style="width: 390px; height: 844px; background: #F6F1E7; color: #2B2A26; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 14px 16px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 14px; color: #3F6B4A;">뒤로</span>
      <span style="font-size: 22px; font-weight: 400;">20101036881</span>
    </div>
    <span style="font-size: 14px; color: #3F6B4A;">새로고침</span>
  </div>

  <div style="margin: 0 16px; background: #F6F1E7; border-radius: 20px; box-shadow: 0 1px 3px rgba(43,42,38,.14); padding: 20px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; color: #4A5A46;">총 평가</div>
    <div style="font-size: 16px; font-weight: 500;">100,000,000</div>
    <div style="font-size: 12px; color: #4A5A46;">예수금(D+2) 10,000,000</div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 12px; color: #4A5A46;">목표 합계 100.00%</span>
    </div>
  </div>

  <div style="display: flex; margin: 16px 16px 0;">
    <div style="flex: 1; text-align: center; padding: 9px 0; border: 1px solid #4A5A46; border-right: 0; border-radius: 999px 0 0 999px; background: #DDE8D6; font-size: 14px;">보유</div>
    <div style="flex: 1; text-align: center; padding: 9px 0; border: 1px solid #4A5A46; border-radius: 0 999px 999px 0; font-size: 14px; color: #4A5A46;">리밸런스</div>
  </div>

  <div style="margin-top: 8px; flex: 1; overflow: hidden;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="padding: 12px 20px; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; justify-content: space-between;">
          <span style="font-size: 16px; font-weight: 500;">{{r.name}}</span>
          <span style="font-size: 16px; font-weight: 500;">{{r.amt}}</span>
        </div>
        <div style="font-size: 12px; color: #4A5A46;">{{r.detail}}</div>
        <div style="display: flex; justify-content: space-between;">
          <span style="font-size: 14px; color: {{r.plc}};">{{r.pl}}</span>
          <span style="font-size: 12px; color: #4A5A46;">비중 {{r.w}}</span>
        </div>
      </div>
      <div style="height: 1px; background: rgba(43,42,38,.12);"></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const R = '#D1453B', B = '#2F6BD1';
    return {
      rows: [
        { name: '현대차', amt: '35,617,500', detail: '보유 150주 · 잔고 150주 · 평균 221,000 · 현재 237,450', pl: '+7.44%', plc: R, w: '35.62%' },
        { name: '삼성전자', amt: '18,550,000', detail: '보유 250주 · 잔고 250주 · 평균 68,400 · 현재 74,200', pl: '+8.48%', plc: R, w: '18.55%' },
        { name: '카카오', amt: '13,245,000', detail: '보유 300주 · 잔고 300주 · 평균 52,300 · 현재 44,150', pl: '-15.58%', plc: B, w: '13.25%' },
        { name: 'SK하이닉스', amt: '11,670,000', detail: '보유 60주 · 잔고 60주 · 평균 178,000 · 현재 194,500', pl: '+9.27%', plc: R, w: '11.67%' },
        { name: 'NAVER', amt: '10,917,500', detail: '보유 55주 · 잔고 55주 · 평균 215,000 · 현재 198,500', pl: '-7.67%', plc: B, w: '10.92%' },
      ],
    };
  }
}
</script>
</body>
</html>
