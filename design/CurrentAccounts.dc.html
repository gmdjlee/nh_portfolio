<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    .cu { font-family: "Noto Sans KR", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    a { color: #3F6B4A; } a:hover { color: #2F4A34; }
  </style>
</helmet>
<div class="cu" style="width: 390px; height: 844px; background: #FFFFFF; color: #111214; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 16px; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 22px;">계좌</span>
    <span style="font-size: 14px; color: #3F6B4A;">설정</span>
  </div>

  <div style="padding-top: 6px; display: flex; flex-direction: column;">
    <sc-for list="{{accounts}}" as="a" hint-placeholder-count="3">
      <div style="margin: 6px 16px; border-radius: 12px; box-shadow: 0 1px 3px rgba(17,18,20,.14); padding: 20px;">
        <span style="font-size: 16px; font-weight: 500;">{{a.no}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1;"></div>
  <div style="padding: 20px 16px; font-size: 11px; color: #9AA1AC; line-height: 1.6;">
    계좌번호 말고는 아무것도 없습니다. 어느 계좌가 무엇인지, 얼마가 들었는지<br>
    알려면 하나씩 열어 봐야 합니다.
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      accounts: [
        { no: '20101036881' },
        { no: '20101047992' },
        { no: '20101055103' },
      ],
    };
  }
}
</script>
</body>
</html>
