<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    .st { font-family: "Noto Sans KR", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .st .sec { font-size: 11px; font-weight: 700; color: #8A9099; letter-spacing: .06em; padding-left: 4px; }
    .st .card { background: #FFFFFF; border: 1px solid #EDEFF2; border-radius: 14px; }
    .st .row { font-size: 15px; font-weight: 500; }
    .st .hint { font-size: 12px; line-height: 1.5; color: #8A9099; }
    a { color: #3F6B4A; } a:hover { color: #2F4A34; }
  </style>
</helmet>
<div class="st" style="width: 390px; height: 844px; background: #F7F8FA; color: #111214; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 52px; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #EDEFF2; flex-shrink: 0;">
    <div style="height: 44px; padding: 0 10px; display: flex; align-items: center;">
      <span style="font-size: 14px; font-weight: 700; color: #3F6B4A;">뒤로</span>
    </div>
    <span style="font-size: 15px; font-weight: 700;">설정</span>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 8px;">

    <span class="sec">NH PLUG 앱 키</span>
    <div class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #3F6B4A;"></div>
        <span style="font-size: 13px; font-weight: 700; color: #3F6B4A;">저장됨</span>
      </div>
      <span class="hint">저장된 값은 다시 보여주지 않습니다. 바꾸려면 새로 입력해 저장하세요.</span>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="position: relative; border: 1px solid #D6DBE2; border-radius: 10px; height: 48px; display: flex; align-items: center; padding: 0 14px;">
          <span style="position: absolute; top: -7px; left: 11px; background: #FFFFFF; padding: 0 4px; font-size: 11px; font-weight: 500; color: #6E7481;">appkey</span>
          <span style="font-size: 15px; letter-spacing: .18em; color: #6E7481;">••••••••••••</span>
        </div>
        <div style="position: relative; border: 1px solid #D6DBE2; border-radius: 10px; height: 48px; display: flex; align-items: center; padding: 0 14px;">
          <span style="position: absolute; top: -7px; left: 11px; background: #FFFFFF; padding: 0 4px; font-size: 11px; font-weight: 500; color: #6E7481;">appsecretkey</span>
          <span style="font-size: 15px; letter-spacing: .18em; color: #6E7481;">••••••••••••••••</span>
        </div>
      </div>
      <div style="height: 46px; border-radius: 12px; background: #3F6B4A; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 15px; font-weight: 700; color: #FFFFFF;">저장</span>
      </div>
    </div>

    <span class="sec" style="margin-top: 12px;">화면</span>
    <div class="card" style="padding: 14px; display: flex; flex-direction: column; gap: 11px;">
      <span class="row">테마</span>
      <div style="display: flex; height: 40px; border: 1px solid #D6DBE2; border-radius: 20px; overflow: hidden;">
        <div style="flex: 1; background: #E4EDE6; display: flex; align-items: center; justify-content: center; gap: 5px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2F4A34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          <span style="font-size: 14px; font-weight: 700; color: #2F4A34;">자동</span>
        </div>
        <div style="width: 1px; background: #D6DBE2;"></div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 14px; font-weight: 500; color: #444B57;">밝게</span>
        </div>
        <div style="width: 1px; background: #D6DBE2;"></div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center;">
          <span style="font-size: 14px; font-weight: 500; color: #444B57;">어둡게</span>
        </div>
      </div>
    </div>

    <span class="sec" style="margin-top: 12px;">보안</span>
    <div class="card" style="display: flex; flex-direction: column;">
      <div style="height: 56px; padding: 0 14px; display: flex; align-items: center;">
        <span class="row">지문으로 잠금 해제</span>
        <span style="flex: 1;"></span>
        <div style="width: 46px; height: 26px; border-radius: 13px; background: #3F6B4A; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px;">
          <div style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF;"></div>
        </div>
      </div>
      <div style="height: 1px; background: #EDEFF2; margin: 0 14px;"></div>
      <div style="height: 56px; padding: 0 14px; display: flex; align-items: center;">
        <span class="row">PIN 변경</span>
        <span style="flex: 1;"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4BAC4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

    <div class="card" style="margin-top: 20px; padding: 14px; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center;">
        <span class="row" style="font-weight: 700; color: #B3412F;">앱 초기화</span>
        <span style="flex: 1;"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D3A79E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <span class="hint">앱 키·토큰·목표 비중·PIN 을 모두 지웁니다. 되돌릴 수 없습니다.</span>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
