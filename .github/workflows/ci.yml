name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # 사양 §12 — PIN 숫자가 시스템 saved-state 번들에 실리면 안 된다.
      # 주석(`*`, `//`)은 제외한다 — LockScreen.kt 의 KDoc 이 "쓰지 않는다" 를
      # 설명하려고 두 이름을 그대로 인용하고 있어서, 안 걸러내면 항상 빨간불이 된다.
      - name: PIN 은 저장 상태에 들어가지 않는다
        run: >-
          ! grep -rn 'rememberSaveable\|SavedStateHandle'
          app/src/main/kotlin/dev/nhportfolio/lock
          app/src/main/kotlin/dev/nhportfolio/settings
          | grep -vE ':[0-9]+: *(\*|//)'
      - name: Build, test, analyse
        run: ./gradlew ktlintCheck detekt testDebugUnitTest assembleDebug assembleRelease --no-daemon
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/release
