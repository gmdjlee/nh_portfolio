<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    body { margin: 0; }
    .c { font-family: "Noto Sans KR", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .c .num { font-weight: 700; letter-spacing: -.025em; }
    a { color: #7DD8A0; } a:hover { color: #A8E8C0; }
  </style>
</helmet>
<div class="c" style="width: 390px; height: 844px; background: #0E1116; color: #F2F4F7; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F4F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span style="font-size: 15px; font-weight: 700; color: #C3CAD6;">20101036881</span>
    </div>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7DD8A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/></svg>
  </div>

  <div style="margin: 4px 16px 0; padding: 20px 18px; border-radius: 18px; background: linear-gradient(160deg, #1A2028 0%, #141920 100%); border: 1px solid #242B35; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 12px; font-weight: 500; color: #8B93A1; letter-spacing: .04em;">총 평가금액</span>
      <span class="num" style="font-size: 36px; line-height: 1.05;">100,000,000</span>
      <span class="num" style="font-size: 15px; color: #FF5A4E;">▲ 4,182,500 · +4.36%</span>
    </div>
    <div style="height: 1px; background: #242B35;"></div>
    <div style="display: flex; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 11px; color: #8B93A1;">현금 D+2</span>
        <span class="num" style="font-size: 16px;">10,000,000</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; align-items: flex-end;">
        <span style="font-size: 11px; color: #8B93A1;">목표 합계</span>
        <span class="num" style="font-size: 16px; color: #7DD8A0;">100.00%</span>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 6px; padding: 16px 16px 12px;">
    <div style="flex: 1; text-align: center; padding: 11px 0; border-radius: 11px; background: #7DD8A0; color: #0E1116; font-size: 14px; font-weight: 700;">보유</div>
    <div style="flex: 1; text-align: center; padding: 11px 0; border-radius: 11px; background: #1A2028; color: #8B93A1; font-size: 14px; font-weight: 500;">리밸런스</div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 16px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="padding: 13px 14px; margin-bottom: 8px; border-radius: 14px; background: #151A21; border: 1px solid #212832; display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 16px; font-weight: 700;">{{r.name}}</span>
          <span class="num" style="font-size: 18px;">{{r.amt}}</span>
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 12px; color: #8B93A1;">{{r.qty}}주 · {{r.price}}</span>
          <span class="num" style="font-size: 14px; color: {{r.plc}};">{{r.pl}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="flex: 1; height: 6px; border-radius: 3px; background: #232A34; position: relative; overflow: hidden;">
            <div style="position: absolute; inset: 0 auto 0 0; width: {{r.wNow}}; background: {{r.plc}}; opacity: .75;"></div>
            <div style="position: absolute; top: -3px; bottom: -3px; left: {{r.wTgt}}; width: 2px; background: #7DD8A0;"></div>
          </div>
          <span class="num" style="font-size: 12px; color: #C3CAD6; min-width: 94px; text-align: right;">{{r.wLabel}}</span>
        </div>
        <div style="display: flex; justify-content: flex-end;">
          <span class="num" style="font-size: 13px; font-weight: 700; color: {{r.dc}}; background: {{r.dbg}}; padding: 5px 11px; border-radius: 9px;">{{r.delta}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const R = '#FF5A4E', B = '#4D8DFF';
    return {
      rows: [
        { name: '현대차', amt: '35,617,500', qty: '150', price: '237,450', pl: '+7.44%', plc: R,
          wNow: '89%', wTgt: '100%', wLabel: '35.62% → 40.00%', delta: '18주 매수', dc: R, dbg: 'rgba(255,90,78,.14)' },
        { name: '삼성전자', amt: '18,550,000', qty: '250', price: '74,200', pl: '+8.48%', plc: R,
          wNow: '46%', wTgt: '50%', wLabel: '18.55% → 20.00%', delta: '19주 매수', dc: R, dbg: 'rgba(255,90,78,.14)' },
        { name: '카카오', amt: '13,245,000', qty: '300', price: '44,150', pl: '-15.58%', plc: B,
          wNow: '33%', wTgt: '25%', wLabel: '13.25% → 10.00%', delta: '74주 매도', dc: B, dbg: 'rgba(77,141,255,.14)' },
        { name: 'SK하이닉스', amt: '11,670,000', qty: '60', price: '194,500', pl: '+9.27%', plc: R,
          wNow: '29%', wTgt: '25%', wLabel: '11.67% → 10.00%', delta: '9주 매도', dc: B, dbg: 'rgba(77,141,255,.14)' },
      ],
    };
  }
}
</script>
</body>
</html>
